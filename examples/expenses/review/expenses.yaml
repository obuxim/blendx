format: 1
resource: expenses
source: blends/expenses.ts
record:
  id: integer
  user_id: integer
  description: string, at most 200 characters
  category: one of travel, meals, office, other
  amount: string
  tax: string
  total: string
  status: one of draft, submitted, approved, rejected
  spent_on: string
  review_note: string, at most 500 characters, or null
  created_at: string
  updated_at: string
  deleted_at: string, or null
actions:
  index:
    route: GET /expenses
    input:
      page: string, matching ^[1-9][0-9]*$, optional
      per_page: string, matching ^[1-9][0-9]*$, optional
      sort: one of id, user_id, status, spent_on, -id, -user_id, -status, -spent_on, optional
      id: string, optional
      user_id: string, optional
      status: string, optional
      spent_on: string, optional
    stages:
      rules: page, per_page, sort, and filters on key and indexed columns
      load: a filtered, sorted page of rows that are not soft-deleted
      authorize: authenticated # from: schema, action
      calculate: nothing
      save: nothing
      respond: 200 with a page of records
    reply:
      status: 200
      body: a page of records

  store:
    route: POST /expenses
    input:
      description: string, at most 200 characters
      category: one of travel, meals, office, other
      amount: string, matching ^\d{1,8}(\.\d{1,2})?$
      spent_on: string (date), matching ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
    stages:
      rules: the insert columns, without generated ones # from: schema, action
      load: nothing
      authorize: authenticated
      calculate: the input's writable columns # from: schema, action
      save: insert, setting created_at and updated_at # from: schema, action
      respond: 201 with the saved record
    calculate:
      source: |-
        ({ input }) => ({ ...input, ...price(input.amount, input.category) })
      writes: [amount, category, description, spent_on, tax, total]
    reply:
      status: 201
      body: the record

  quote:
    route: GET /expenses/quote
    input:
      amount: string, matching ^\d{1,8}(\.\d{1,2})?$
      category: one of travel, meals, office, other
    stages:
      rules: nothing (an empty object) # from: schema, action
      load: nothing
      authorize: authenticated
      calculate: the input's writable columns # from: schema, action
      save: nothing
      respond: 200 with what calculate returns
    calculate:
      source: |-
        ({ input }) => price(input.amount, input.category)
      returns: [tax, total]
    reply:
      status: 200
      body:
        tax: string
        total: string

  show:
    route: GET /expenses/:id
    stages:
      rules: nothing (an empty object)
      load: the row by id, not soft-deleted
      authorize: the claimant, or an approver
      calculate: nothing
      save: nothing
      respond: 200 with the record
    reply:
      status: 200
      body: the record

  update:
    route: PATCH /expenses/:id
    input:
      description: string, at most 200 characters, optional
      category: one of travel, meals, office, other, optional
      amount: string, matching ^\d{1,8}(\.\d{1,2})?$, optional
      spent_on: string (date), matching ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$, optional
    stages:
      rules: the insert columns, all optional # from: schema, action
      load: the row by id, not soft-deleted, locked for update
      authorize: owner (user_id = auth.id) # from: schema, action
      calculate: the input's writable columns # from: schema, action
      save: update the row, touching updated_at, when there is something to write
      respond: 200 with the saved record
    calculate:
      source: |-
        ({ input, record }) => ({
          ...input,
          ...price(input.amount ?? record.amount, input.category ?? record.category),
        })
      writes: [amount, category, description, spent_on, tax, total]
    reply:
      status: 200
      body: the record

  destroy:
    route: DELETE /expenses/:id
    stages:
      rules: nothing (an empty object)
      load: the row by id, not soft-deleted, locked for update
      authorize: owner (user_id = auth.id) # from: schema, action
      calculate: nothing
      save: "soft delete: set deleted_at, touching updated_at"
      respond: 204 with no body
    reply:
      status: 204
      body: none

  restore:
    route: POST /expenses/:id/restore
    stages:
      rules: nothing (an empty object)
      load: the soft-deleted row by id, locked for update
      authorize: owner (user_id = auth.id)
      calculate: nothing
      save: clear deleted_at, touching updated_at
      respond: 200 with the restored record
    reply:
      status: 200
      body: the record

  approve:
    route: POST /expenses/:id/approve
    stages:
      rules: nothing (an empty object)
      load: the row by id, not soft-deleted, locked for update
      authorize: an approver # from: schema, action
      calculate: the input's writable columns # from: schema, action
      save: update the row, touching updated_at, when there is something to write
      respond: 200 with the saved record
    calculate:
      source: |-
        () => ({ status: 'approved' as const })
      writes: [status]
    reply:
      status: 200
      body: the record

  reject:
    route: POST /expenses/:id/reject
    input:
      note: string, at least 3 characters, at most 500 characters
    stages:
      rules: nothing (an empty object) # from: schema, action
      load: the row by id, not soft-deleted, locked for update
      authorize: an approver # from: schema, action
      calculate: the input's writable columns # from: schema, action
      save: update the row, touching updated_at, when there is something to write
      respond: 200 with the saved record
    calculate:
      source: |-
        ({ input }) => ({ status: 'rejected' as const, review_note: input.note })
      writes: [review_note, status]
    reply:
      status: 200
      body: the record

  submit:
    route: POST /expenses/:id/submit
    stages:
      rules: nothing (an empty object)
      load: the row by id, not soft-deleted, locked for update
      authorize: owner (user_id = auth.id) # from: schema, action
      calculate: the input's writable columns # from: schema, action
      save: update the row, touching updated_at, when there is something to write
      respond: 200 with the saved record
    calculate:
      source: |-
        () => ({ status: 'submitted' as const })
      writes: [status]
    reply:
      status: 200
      body: the record
