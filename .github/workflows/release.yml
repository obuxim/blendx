name: release

# A release is a tag v<version> (docs/decisions.md D35): the whole check, the tag against every
# package's version, then the six tarballs staged on npm in dependency order through npm's trusted
# publishing, with provenance and no token. Nothing goes live here: the maintainer approves each
# staged package with 2FA (docs/releasing.md). Run by hand with dry_run to rehearse without staging.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rehearse: pack and run npm publish --dry-run, publishing nothing"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run check
      - if: github.ref_type == 'tag'
        run: bun run version --check "$GITHUB_REF_NAME"
      - run: bun run pack tarballs
      # npm stage needs npm 11.15 or later; Node's bundled npm is not pinned, so this one is.
      - run: npm install -g npm@12.1.0
      # A package already on npm at this version is skipped, so a rerun after a partial failure
      # stages only what is missing, and a tag for a version published by hand runs green.
      # DRY_RUN is 'true' or empty: a boolean expression would give the string "false", which
      # ${DRY_RUN:+--dry-run} treats as set.
      - name: Stage in dependency order
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || '' }}
        run: |
          version=$(bun -e 'console.log(JSON.parse(await Bun.file("packages/blendx/package.json").text()).version)')
          for name in blendx-dbml blendx-core blendx-hono blendx blendx-cli blendx-react; do
            case "$name" in blendx) package=blendx ;; *) package="@blendx/${name#blendx-}" ;; esac
            if [ -z "$DRY_RUN" ] && npm view "$package@$version" version >/dev/null 2>&1; then
              echo "$package@$version is already on npm, skipping"
              continue
            fi
            npm stage publish "./tarballs/$name-$version.tgz" --provenance --access public ${DRY_RUN:+--dry-run}
          done
          echo "Staged $version; approve each package with 2FA: npm stage list, then npm stage approve <id> (docs/releasing.md)"
