name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check

  postgres:
    # Runs the DB-backed tests against real PostgreSQL instead of PGlite.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blendx_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BLENDX_TEST_DB: pg
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/blendx_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun test
      # The Node smoke test: @hono/node-server and the pg driver, over real HTTP.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun run smoke:node
      # The conformance suite on Node with pg (Bun with pg runs in bun test above).
      - run: bun run conformance:node

  e2e-web:
    # examples/addition/web in Chromium, through Playwright (Node) against Vite and the API (Bun).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run --cwd examples/addition/web e2e:install
      - run: bun run e2e:web
