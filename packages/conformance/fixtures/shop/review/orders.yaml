  refund:
    route: POST /orders/:id/refund
    input:
      reason: string, at least 3 characters
    stages:
      rules: nothing (an empty object) # from: schema, action
      load: the row by id, not soft-deleted, locked for update
      authorize: owner (user_id = auth.id)
      calculate: the input's writable columns # from: schema, action
      save:
        default: update the row, touching updated_at, when there is something to write
        limitation: Declared related-table writes occur outside this default.
        writes: [users]
      respond: 200 with the saved record
    calculate:
      source: |-
        () => ({ status: 'refunded' as const })
      writes: [status]
    reply:
      status: 200
      body: the record
