format: 1
resource: orders
source: blends/orders.ts
record:
  id: integer
  user_id: integer
  status: one of pending, paid, refunded
  total: string
  quantity: integer
  tags: list of string, or null
  meta: string or number or boolean, or null or object or list of any JSON, or null
  public_id: string (uuid)
  placed_on: string, or null
  weight: number, or null
  created_at: string
  updated_at: string
  deleted_at: string, or null
includes:
  user: "users, through its show: authenticated"
  notes: "order_notes, at most 2, by id descending, through its show: authenticated"
  notes.author: "users, through its show: authenticated"
  items: "order_items, at most 10, by order_id ascending, through its show: authenticated"
actions:
  index:
    route: GET /orders
    input:
      page: string, matching ^[1-9][0-9]*$, optional
      per_page: string, matching ^[1-9][0-9]*$, optional
      sort: one of id, user_id, status, public_id, created_at, -id, -user_id, -status, -public_id, -created_at, optional
      id: string, optional
      user_id: string, optional
      status: string, optional
      public_id: string, optional
      created_at: string (timestamp), optional
      trashed: one of with, only, optional
      include: string, optional
    stages:
      rules: page, per_page, sort, and filters on key and indexed columns
      load: a filtered, sorted page of rows that are not soft-deleted
      authorize: public
      calculate: nothing
      save: nothing
      respond: 200 with a page of records
    reply:
      status: 200
      body: a page of records

  store:
    route: POST /orders
    input:
      user_id: integer
      status: one of pending, paid, refunded, optional
      total: string
      quantity: integer, optional
      tags: list of string, or null, optional
      meta: string or number or boolean, or null or object or list of any JSON, or null, optional
      public_id: string (uuid), optional
      placed_on: string (date), or null, optional
      weight: number, or null, optional
    stages:
      rules: the insert columns, without generated ones
      load: nothing
      authorize:
        default: authenticated
        limitation: Custom hooks can change this policy decision.
        hooks:
          action:
            file: blends/orders.ts
            source: |-
              ({ prev, auth, input }) => prev && input.user_id === auth?.id
      calculate: the input's writable columns
      save: insert, setting created_at and updated_at
      respond: 201 with the saved record
    calculate:
      writes: [meta, placed_on, public_id, quantity, status, tags, total, user_id, weight]
    reply:
      status: 201
      body: the record

  quote:
    route: GET /orders/quote
    input:
      quantity: string, matching ^[1-9][0-9]*$
    stages:
      rules: nothing (an empty object) # from: schema, action
      load: nothing
      authorize: public
      calculate: the input's writable columns # from: schema, action
      save: nothing
      respond: 200 with what calculate returns
    calculate:
      source: |-
        ({ input }) => ({ total: (Number(input.quantity) * 9.5).toFixed(2) })
      returns: [total]
    reply:
      status: 200
      body:
        total: string

  show:
    route: GET /orders/:id
    input:
      include: string, optional
    stages:
      rules: nothing (an empty object)
      load: the row by id, not soft-deleted
      authorize: owner (user_id = auth.id)
      calculate: nothing
      save: nothing
      respond: 200 with the record
    reply:
      status: 200
      body: the record

  update:
    route: PATCH /orders/:id
    input:
      user_id: integer, optional
      status: one of pending, paid, refunded, optional
      total: string, optional
      quantity: integer, optional
      tags: list of string, or null, optional
      meta: string or number or boolean, or null or object or list of any JSON, or null, optional
      public_id: string (uuid), optional
      placed_on: string (date), or null, optional
      weight: number, or null, optional
    stages:
      rules: the insert columns, all optional
      load: the row by id, not soft-deleted, locked for update
      authorize: owner (user_id = auth.id)
      calculate: the input's writable columns
      save: update the row, touching updated_at, when there is something to write
      respond: 200 with the saved record
    calculate:
      writes: [meta, placed_on, public_id, quantity, status, tags, total, user_id, weight]
    reply:
      status: 200
      body: the record

  replace:
    route: PUT /orders/:id
    input:
      user_id: integer
      status: one of pending, paid, refunded, optional
      total: string
      quantity: integer, optional
      tags: list of string, or null, optional
      meta: string or number or boolean, or null or object or list of any JSON, or null, optional
      public_id: string (uuid), optional
      placed_on: string (date), or null, optional
      weight: number, or null, optional
    stages:
      rules: the insert columns without the key, hidden ones optional
      load: the row by id, not soft-deleted, locked for update
      authorize: owner (user_id = auth.id)
      calculate: the input's writable columns, and null for each visible column the body leaves out that has no default
      save: "replace the row, touching updated_at: the writes, and each visible column the body leaves out back to its default"
      respond: 200 with the saved record
    calculate:
      writes: [meta, placed_on, public_id, quantity, status, tags, total, user_id, weight]
    resets:
      to_default: [status, quantity, public_id]
      to_null: [tags, meta, placed_on, weight]
    reply:
      status: 200
      body: the record

  destroy:
    route: DELETE /orders/:id
    stages:
      rules: nothing (an empty object)
      load: the row by id, not soft-deleted, locked for update
      authorize: owner (user_id = auth.id)
      calculate: nothing
      save: "soft delete: set deleted_at, touching updated_at"
      respond: 204 with no body
    reply:
      status: 204
      body: none

  restore:
    route: POST /orders/:id/restore
    stages:
      rules: nothing (an empty object)
      load: the soft-deleted row by id, locked for update
      authorize: owner (user_id = auth.id)
      calculate: nothing
      save: clear deleted_at, touching updated_at
      respond: 200 with the restored record
    reply:
      status: 200
      body: the record

  purge:
    route: DELETE /orders/:id/purge
    stages:
      rules: nothing (an empty object)
      load: the row by id, soft-deleted or not, locked for update
      authorize: owner (user_id = auth.id)
      calculate: nothing
      save: delete the row for good
      respond: 204 with no body
    reply:
