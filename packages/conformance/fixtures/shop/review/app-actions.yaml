actions:
  accept_invite:
    route: POST /invites/:token/accept
    policy: authenticated
    writes: [project_members, invites]
    reply:
      status: 200
      body:
        project_id: integer
        accepted: exactly true
    errors: [400, 401, 409, 422]

  bulk_assign_tasks:
    route: POST /tasks/bulk-assign
    policy: authenticated
    input:
      task_ids: list of integer
      assignee_id: integer
    writes: [tasks]
    reply:
      status: 200
      body:
        assigned: integer
    errors: [400, 401, 409, 422]

  replace_task_assignees:
    route: PUT /tasks/:id/assignees
    policy: authenticated
    input:
      assignees: list of object
    writes: [tasks, task_assignees]
    reply:
      status: 200
      body:
        task_id: integer
        assignees: list of object
    errors: [400, 401, 409, 422]

  task_count:
    route: GET /reports/task-count
    policy: authenticated
    writes: []
    reply:
      status: 200
      body:
        total: integer
    errors: [401, 422]

  upload_avatar:
    route: POST /users/:id/avatar
    policy: authenticated
    input_format: multipart/form-data
    max_bytes: 524288
    input:
      file: string (binary), at most 262144 characters
      caption: string, at most 120 characters, optional
    writes: [uploads, users]
    reply:
      status: 201
      body:
        id: integer
        byte_length: integer
    errors: [400, 413, 401, 409, 422]
