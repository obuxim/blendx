format: 1
resource: users
source: blends/users.ts
hidden: [password]
record:
  id: integer
  email: string, at most 255 characters
  display_name: string, at most 80 characters, or null
  is_active: boolean
  created_at: string
  updated_at: string
actions:
  index:
    route: GET /users
    input:
      page: string, matching ^[1-9][0-9]*$, optional
      per_page: string, matching ^[1-9][0-9]*$, optional
      sort: one of id, email, -id, -email, optional
      id: string, optional
      email: string, optional
    stages:
      rules: page, per_page, sort, and filters on key and indexed columns
      load: a filtered, sorted page of rows # from: schema, action
      authorize: authenticated
      calculate: nothing
      save: nothing
      respond: 200 with a page of records
    scope:
      source: |-
        ({ auth }) => ({ id: auth?.id })
      columns: [id]
    reply:
      status: 200
      body: a page of records

  store:
    route: POST /users
    input:
      email: string, at most 255 characters
      password: string, at most 255 characters
      display_name: string, at most 80 characters, or null, optional
      is_active: boolean, optional
    stages:
      rules: the insert columns, without generated ones
      load: nothing
      authorize: public
      calculate: the input's writable columns
      save: insert, setting created_at and updated_at
      respond: 201 with the saved record
    calculate:
      writes: [display_name, email, is_active, password]
    reply:
      status: 201
      body: the record

  show:
    route: GET /users/:id
    stages:
      rules: nothing (an empty object)
      load: the row by id
      authorize: authenticated
      calculate: nothing
      save: nothing
      respond: 200 with the record
    reply:
      status: 200
      body: the record

  update:
    route: PATCH /users/:id
    input:
      email: string, at most 255 characters, optional
      password: string, at most 255 characters, optional
      display_name: string, at most 80 characters, or null, optional
      is_active: boolean, optional
    stages:
      rules: the insert columns, all optional
      load: the row by id, locked for update
      authorize: owner (id = auth.id)
      calculate: the input's writable columns
      save: update the row, touching updated_at, when there is something to write
      respond: 200 with the saved record
    calculate:
      writes: [display_name, email, is_active, password]
    reply:
      status: 200
      body: the record
